{% extends "base.html" %}
{% block title %}登录 — 卡密管理系统{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white rounded-xl shadow-md p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-6">卡密管理系统</h1>

        <div id="login-error" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-2"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                <input type="text" id="username" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="请输入用户名">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input type="password" id="password" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="请输入密码">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">验证码</label>
                <input type="text" id="otp-code" maxlength="6" inputmode="numeric" autocomplete="one-time-code"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg tracking-widest font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="000000">
            </div>
            <button type="submit"
                    class="w-full bg-gray-900 text-white rounded-lg py-2.5 font-medium hover:bg-gray-800 transition">
                登 录
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('login-error');
        errEl.classList.add('hidden');

        try {
            const resp = await fetch(apiUrl('/auth/login'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    otp_code: document.getElementById('otp-code').value.trim(),
                    captcha_code: '',
                    captcha_key: '',
                }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                errEl.textContent = data.detail || '登录失败';
                errEl.classList.remove('hidden');
                return;
            }
            AUTH.setTokens(data.access_token, data.refresh_token);
            window.location.href = '/';
        } catch(err) {
            errEl.textContent = '网络错误，请重试';
            errEl.classList.remove('hidden');
        }
    });

    loadApiPrefix();
</script>
{% endblock %}
