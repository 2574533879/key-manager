{% extends "base.html" %}
{% block title %}应用管理 — 卡密管理系统{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">应用管理</h1>
    <button onclick="openAddModal()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800">
        + 新增应用
    </button>
</div>

<!-- Search -->
<div class="bg-white rounded-lg shadow p-4 mb-4">
    <input type="text" id="search" placeholder="搜索应用名称 / 编号 / 描述..."
           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
           oninput="loadApps()">
</div>

<!-- Table -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50">
            <tr>
                <th class="text-left px-4 py-3 font-medium text-gray-600">应用名称</th>
                <th class="text-left px-4 py-3 font-medium text-gray-600">应用编号</th>
                <th class="text-left px-4 py-3 font-medium text-gray-600">描述</th>
                <th class="text-left px-4 py-3 font-medium text-gray-600">卡密数量</th>
                <th class="text-left px-4 py-3 font-medium text-gray-600">创建时间</th>
                <th class="text-right px-4 py-3 font-medium text-gray-600">操作</th>
            </tr>
        </thead>
        <tbody id="app-list" class="divide-y divide-gray-100"></tbody>
    </table>
    <div id="pagination" class="px-4 py-3 border-t flex justify-between items-center text-sm"></div>
</div>

<!-- Add/Edit Modal -->
<div id="app-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md">
        <h2 class="text-lg font-bold mb-4" id="modal-title">新增应用</h2>
        <input type="hidden" id="edit-id">
        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">应用名称 *</label>
                <input type="text" id="app-name" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">应用编号</label>
                <input type="text" id="app-code" maxlength="32" class="w-full border rounded-lg px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1">客户端认证时使用此编号，修改后需同步客户端</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <textarea id="app-desc" rows="3" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
            <button onclick="closeModal('app-modal')" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-50">取消</button>
            <button onclick="saveApp()" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm hover:bg-gray-800">保存</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

async function loadApps(page = 1) {
    if (!requireAuth()) return;
    currentPage = page;
    const search = document.getElementById('search').value;
    try {
        const data = await AUTH.get(apiUrl(`/applications?search=${encodeURIComponent(search)}&page=${page}&page_size=15`));
        const tbody = document.getElementById('app-list');
        tbody.innerHTML = data.map(a => `
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">${esc(a.name)}</td>
                <td class="px-4 py-3 font-mono text-xs text-gray-500">${esc(a.app_code)}</td>
                <td class="px-4 py-3 text-gray-500 max-w-xs truncate">${esc(a.description)}</td>
                <td class="px-4 py-3">${a.key_count}</td>
                <td class="px-4 py-3 text-gray-500 text-xs">${a.created_at}</td>
                <td class="px-4 py-3 text-right">
                    <button onclick="editApp(${a.id})" class="text-blue-600 hover:underline text-xs mr-2">编辑</button>
                    <button onclick="delApp(${a.id}, '${esc(a.name)}', ${a.key_count})" class="text-red-600 hover:underline text-xs">删除</button>
                </td>
            </tr>
        `).join('');
        document.getElementById('pagination').innerHTML = `
            <span class="text-gray-500">共 ${data.length} 条 (第 ${page} 页)</span>
            <div class="flex gap-1">
                <button onclick="loadApps(${page-1})" ${page<=1?'disabled':''} class="px-3 py-1 border rounded text-sm ${page<=1?'opacity-40':'hover:bg-gray-50'}">上一页</button>
                <button onclick="loadApps(${page+1})" ${data.length<15?'disabled':''} class="px-3 py-1 border rounded text-sm ${data.length<15?'opacity-40':'hover:bg-gray-50'}">下一页</button>
            </div>`;
    } catch(e) { showToast(e.message, 'error'); }
}

function openAddModal() {
    document.getElementById('modal-title').textContent = '新增应用';
    document.getElementById('edit-id').value = '';
    document.getElementById('app-name').value = '';
    document.getElementById('app-code').value = '';
    document.getElementById('app-desc').value = '';
    openModal('app-modal');
}

async function editApp(id) {
    try {
        const a = await AUTH.get(apiUrl(`/applications/${id}`));
        document.getElementById('modal-title').textContent = '编辑应用';
        document.getElementById('edit-id').value = a.id;
        document.getElementById('app-name').value = a.name;
        document.getElementById('app-code').value = a.app_code;
        document.getElementById('app-desc').value = a.description;
        openModal('app-modal');
    } catch(e) { showToast(e.message, 'error'); }
}

async function saveApp() {
    const id = document.getElementById('edit-id').value;
    const name = document.getElementById('app-name').value.trim();
    const appCode = document.getElementById('app-code').value.trim();
    const description = document.getElementById('app-desc').value.trim();
    if (!name) return showToast('请输入应用名称', 'warning');
    const body = { name, description };
    if (appCode) body.app_code = appCode;
    try {
        if (id) {
            await AUTH.put(apiUrl(`/applications/${id}`), body);
            showToast('更新成功');
        } else {
            await AUTH.post(apiUrl('/applications'), body);
            showToast('创建成功');
        }
        closeModal('app-modal');
        loadApps(currentPage);
    } catch(e) { showToast(e.message, 'error'); }
}

async function delApp(id, name, keyCount) {
    if (keyCount > 0) {
        return showToast(`应用 [${name}] 下有 ${keyCount} 张卡密，请先删除卡密`, 'warning');
    }
    if (!confirm(`确定删除应用 [${name}]？`)) return;
    try {
        await AUTH.del(apiUrl(`/applications/${id}`));
        showToast('删除成功');
        loadApps(currentPage);
    } catch(e) { showToast(e.message, 'error'); }
}

function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadApiPrefix().then(() => loadApps());
</script>
{% endblock %}
